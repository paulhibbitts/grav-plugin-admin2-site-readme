name: Admin2 Site ReadMe
slug: admin2-site-readme
type: plugin
version: 0.9.0
description: 'Shows a site''s own ReadMe in the Admin 2 sidebar, from a Markdown file on GitHub or in the site itself. The people editing a site can then read its how-tos where they work.'
icon: book-open
author:
  name: HibbittsDesign.org
  email: hello@hibbittsdesign.org
  url: https://hibbittsdesign.org
homepage: https://github.com/paulhibbitts/grav-plugin-admin2-site-readme
keywords: admin, admin2, readme, guide, documentation, markdown
bugs: https://github.com/paulhibbitts/grav-plugin-admin2-site-readme/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }
  - { name: admin2, version: '>=2.0.0' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    markdown_url:
      type: text
      label: 'Markdown File Address'
      description: 'An https address, such as a README on GitHub, or a Markdown file in this site, such as user://data/site-readme.md.'
      placeholder: 'https://github.com/owner/repository/blob/main/README.md'
      size: x-large

    page_title:
      type: text
      label: 'Page Title'
      help: 'The title of the page in Admin. Defaults to Site ReadMe.'
      placeholder: 'Site ReadMe'
      size: medium

    hide_title:
      type: select
      label: 'Hide File Title'
      help: 'Hides the file''s title (its first heading), as the page already has one.'
      default: 1
      options:
        0: 'No'
        1: 'A # title'
        2: 'A # or ## title'
      validate:
        type: int

    contents_levels:
      type: select
      label: 'On This Page Headings'
      help: 'The heading levels listed in the On this page list.'
      default: 3
      options:
        2: 'Level 2 (##)'
        3: 'Levels 2–3 (## and ###)'
        4: 'Levels 2–4 (## to ####)'
      validate:
        type: int

    sidebar_label:
      type: text
      label: 'Sidebar Label'
      help: 'The name of the item in the Admin sidebar (the Page Title by default); a | marks where a long name may break.'
      placeholder: 'Site ReadMe'
      size: medium

    sidebar_icon:
      type: text
      label: 'Sidebar Icon'
      help: 'A Font Awesome icon name, such as fa-book-open or fa-circle-question.'
      placeholder: 'fa-book-open'
      size: medium

    sidebar_priority:
      type: number
      label: 'Sidebar Position'
      help: 'Lower numbers appear higher in the sidebar. Defaults to 5.'
      size: x-small
      validate:
        type: int
        min: 0

    cache_minutes:
      type: number
      label: 'Keep a Copy For (Minutes)'
      help: 'How long to keep the fetched file before fetching it again. Defaults to 60.'
      size: x-small
      validate:
        type: int
        min: 1
